# Accept catalog updates that the cloud routines send as pull requests from claude/ branches.
# A pull request is merged only if it changes nothing but catalog files (and the "What changed"
# notes in the Applied Physics and Astronomy export scripts) and the catalog passes the build check.
# Anything else stays open for a person to review.
name: Accept catalog updates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: catalog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  accept:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'claude/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that only catalog files changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          cat changed.txt
          if grep -v -E '^(catalog/(programs|meta)/[a-z0-9][a-z0-9-]*\.json|engine/export_(ap|astro)\.py)$' changed.txt; then
            echo "::error::This pull request changes files outside the catalog, so it is left for review."
            exit 1
          fi
      - name: Validate the catalog and test-build every page
        run: python3 engine/build.py --check
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
