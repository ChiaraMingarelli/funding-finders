# Rebuild every page from the catalog and publish the combined site (docs/).
# The four single-page repos copy their files from sites/ on their own schedule.
name: Build pages

on:
  push:
    branches: [main]
    paths: ["catalog/**", "templates/**", "engine/**", ".github/workflows/build.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"   # daily safety rebuild, 7:17 am Eastern (EDT)

permissions:
  contents: write
  actions: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the daily schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from the newest main and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python3 engine/build.py
            git add -A docs sites data README.md
            if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
            git commit -q -m "Build pages from the catalog"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved while building; trying again ($attempt)"
            sleep $((attempt * 5))
          done
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
