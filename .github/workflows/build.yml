# Rebuild every page from the catalog and publish the combined site (docs/).
# The four single-page repos copy their files from sites/ on their own schedule.
name: Build pages

on:
  push:
    branches: [main]
    paths: ["catalog/**", "templates/**", "engine/**", ".github/workflows/build.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"   # daily safety rebuild, 7:17 am Eastern (EDT)

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages from the catalog
        run: python3 engine/build.py
      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs sites data README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build pages from the catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
