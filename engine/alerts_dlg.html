<dialog id="alertDlg" class="alertdlg">
  <form method="dialog" id="alertForm">
    <h3>Email me when it opens</h3>
    <p>Your request is saved now. Emails aren't being sent yet; they'll start once the department sets up a sender. Only the page's editors can see this address.</p>
    <label for="alertEmail">Your email</label>
    <input id="alertEmail" type="email" required maxlength="200" autocomplete="email" placeholder="you@university.edu">
    <div class="arow"><button value="ok" class="aok">Save</button><button value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>
